version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: knowledge_base
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kb -d knowledge_base']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kb_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  kb_pg_data:
